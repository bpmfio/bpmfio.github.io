<!DOCTYPE html>
<html lang="zh-cn">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>bpmf.io/api</title>
  <!--
    Go vanity import 元数据：
    go get 工具请求 https://bpmf.io/api?go-get=1 时，依据下方 go-import 标签
    将模块路径 bpmf.io/api 解析到 git 仓库 https://github.com/bpmfio/api。
  -->
  <meta name="go-import" content="bpmf.io/api git https://github.com/bpmfio/api">
  <meta name="go-source" content="bpmf.io/api https://github.com/bpmfio/api https://github.com/bpmfio/api/tree/main{/dir} https://github.com/bpmfio/api/blob/main{/file}#L{L}">
  <meta http-equiv="refresh" content="0; url=https://github.com/bpmfio/api">
</head>
<body>
  <p>
    本页面为 Go 模块 <code>bpmf.io/api</code> 提供导入路径元数据（vanity import）。
    源码仓库位于 <a href="https://github.com/bpmfio/api">github.com/bpmfio/api</a>，
    可通过 <code>go get bpmf.io/api</code> 引用。
  </p>
</body>
</html>
